apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processor
  namespace: lab
  labels:
    app: data-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-processor
  template:
    metadata:
      labels:
        app: data-processor
    spec:
      containers:
        - name: data-processor
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "data-processor starting — processing large dataset..."
              dd if=/dev/zero bs=1M count=150 2>/dev/null | tail -c 1
              echo "Done. Sleeping."
              sleep 3600
          resources:
            requests:
              cpu: 100m
              memory: 128Mi    # Increased
            limits:
              cpu: 500m
              memory: 256Mi    # Increased — gives headroom above actual usage
