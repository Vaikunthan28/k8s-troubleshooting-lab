apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processor
  namespace: lab
  labels:
    app: data-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-processor
  template:
    metadata:
      labels:
        app: data-processor
    spec:
      containers:
        - name: data-processor
          image: python:3.11-slim
          command: ["python3", "-c"]
          args:
            - |
              import time
              print("data-processor starting — processing large dataset...", flush=True)
              print("Allocating 200MB in memory to simulate workload...", flush=True)
              # Allocate and HOLD 200MB — exceeds the 64Mi limit
              # Using python bytearray so memory is held (dd releases it too fast)
              data = bytearray(200 * 1024 * 1024)
              print("Memory allocated and held. Processing...", flush=True)
              time.sleep(3600)
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi    # Too low — process needs ~200MB, triggers OOMKill
