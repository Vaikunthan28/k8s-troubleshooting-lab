apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-sa
  namespace: lab
---
# NOTE: ClusterRole exists but ClusterRoleBinding is intentionally missing
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-logger
  namespace: lab
  labels:
    app: audit-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-logger
  template:
    metadata:
      labels:
        app: audit-logger
    spec:
      serviceAccountName: audit-sa
      containers:
        - name: audit-logger
          image: bitnami/kubectl:latest
          command: ["sh", "-c"]
          args:
            - |
              echo "audit-logger starting..."
              while true; do
                echo "Attempting to list pods across cluster..."
                kubectl get pods --all-namespaces 2>&1 || true
                sleep 10
              done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
