apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: lab
  labels:
    app: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: lab
  labels:
    app: api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
        tier: backend
    spec:
      containers:
        - name: api-server
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "api-server starting..."
              while true; do
                echo "Testing connection to redis-cache:6379..."
                nc -zv redis-cache 6379 2>&1 && echo "Redis: OK" || echo "Redis: UNREACHABLE"
                sleep 5
              done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: lab
spec:
  selector:
    app: redis-cache
  ports:
    - port: 6379
      targetPort: 6379
---
# Default deny all ingress and egress in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: lab
spec:
  podSelector: {}   # Applies to ALL pods in namespace
  policyTypes:
    - Ingress
    - Egress
