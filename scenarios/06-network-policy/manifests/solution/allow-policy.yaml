apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-redis
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: redis-cache   # This policy applies TO redis-cache pods
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-server   # Allow traffic FROM api-server pods only
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress-to-redis
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: api-server   # This policy applies TO api-server pods
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis-cache
      ports:
        - protocol: TCP
          port: 6379
    - ports:
        - port: 53     # Allow DNS resolution
          protocol: UDP
        - port: 53
          protocol: TCP
